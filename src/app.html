<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />

		<!-- Google Tag Manager -->
		<script>
			window.dataLayer = window.dataLayer || [];
			(function (w, d, s, l, i) {
				w[l] = w[l] || [];
				w[l].push({ 'gtm.start': new Date().getTime(), event: 'gtm.js' });
				var f = d.getElementsByTagName(s)[0],
					j = d.createElement(s),
					dl = l != 'dataLayer' ? '&l=' + l : '';
				j.async = true;
				j.src = 'https://www.googletagmanager.com/gtm.js?id=' + i + dl;
				j.onerror = () => {
					console.error('Failed to load GTM');
				};
				f.parentNode.insertBefore(j, f);
			})(window, document, 'script', 'dataLayer', 'GTM-KG6VCVB');
		</script>
		<!-- End Google Tag Manager -->

		<!-- Standard Favicon -->
		<link rel="icon" href="%sveltekit.assets%/favicon.ico" type="image/x-icon" />

		<!-- PNG Favicons -->
		<link rel="icon" type="image/png" sizes="32x32" href="%sveltekit.assets%/favicon-32x32.png" />
		<link rel="icon" type="image/png" sizes="16x16" href="%sveltekit.assets%/favicon-16x16.png" />

		<!-- Apple Touch Icon -->
		<link rel="apple-touch-icon" sizes="180x180" href="%sveltekit.assets%/apple-touch-icon.png" />

		<!-- Android Chrome Icon -->
		<link
			rel="icon"
			type="image/png"
			sizes="192x192"
			href="%sveltekit.assets%/android-chrome-192x192.png"
		/>
		<link
			rel="icon"
			type="image/png"
			sizes="512x512"
			href="%sveltekit.assets%/android-chrome-512x512.png"
		/>

		<!-- Web App Manifest -->
		<link rel="manifest" href="%sveltekit.assets%/site.webmanifest" />

		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<meta name="author" content="Michael Distel" />
		<!-- Add relevant keywords for your site -->
		<meta
			name="keywords"
			content="michael distel, startup notes, early stage, fundraising, blockchain infrastructure, industrial automation, controlforge"
		/>

		<!-- Title, description and the og:/twitter: text tags are per-page and live in
		     Seo.svelte. Putting them here as well gives every page two of each. -->

		<!-- Social card image, shared by every page. Must be an absolute URL:
		     %sveltekit.assets% resolves to a relative path under adapter-static,
		     which Facebook, LinkedIn and X all ignore. -->
		<meta property="og:image" content="https://michaeldistel.com/android-chrome-512x512.png" />
		<meta name="twitter:card" content="summary_large_image" />
		<meta name="twitter:image" content="https://michaeldistel.com/android-chrome-512x512.png" />

		<!-- Speculation Rules API for Speed Brain functionality -->
		<script type="speculationrules">
			{
				"prerender": [
					{
						"where": { "href_matches": "/*" },
						"eagerness": "moderate"
					}
				],
				"prefetch": [
					{
						"where": { "href_matches": "/*" },
						"eagerness": "conservative"
					}
				]
			}
		</script>

		%sveltekit.head%
	</head>

	<body class="bg-slate-900 text-gray-100" data-sveltekit-preload-data="hover">
		<!-- Google Tag Manager (noscript) -->
		<noscript
			><iframe
				src="https://www.googletagmanager.com/ns.html?id=GTM-KG6VCVB"
				height="0"
				width="0"
				style="display: none; visibility: hidden"
			></iframe
		></noscript>
		<!-- End Google Tag Manager (noscript) -->

		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
